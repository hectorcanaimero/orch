# Fallback pricing table for the dashboard.
#
# ONLY used when a SpendEntry lands with `cost_usd == 0` (or None) — typical
# for opencode / local codex where there's no billing pipe. When `cost_usd`
# already has a real number, we honor that and ignore this file.
#
# Overridable per project: drop a `pricing.yaml` at the project root and its
# `models:` map is layered on top of these defaults (project keys win). Keys
# that don't exist in either fall through to `default`.
#
# Prices are USD per 1M tokens.
models:
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
  claude-opus-4-7:
    input: 15.00
    output: 75.00
  claude-haiku-4-5:
    input: 0.80
    output: 4.00
  gpt-5:
    input: 2.50
    output: 10.00
  gpt-5-mini:
    input: 0.50
    output: 2.00
  codex:
    input: 1.00
    output: 4.00
  opencode/deepseek-v4-pro:
    input: 0.50
    output: 2.00
  opencode-go/glm-5.1:
    input: 0.30
    output: 1.20
  # Antigravity gateway (agy CLI) — Google Gemini underlying models.
  gemini-3.1-pro-high:
    input: 1.25
    output: 5.00
  gemini-3.7-flash-medium:
    input: 0.075
    output: 0.30
  default:
    input: 1.00
    output: 4.00
