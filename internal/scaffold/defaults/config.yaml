# config.yaml — runtime knobs. Loaded by orch.py at startup.
# All values copied verbatim from proposal/explore §2 defaults (Batch B seed).

concurrency:
  # Hard cap on TOTAL in-flight subprocesses across all backends (FR-D-5).
  global_max: 8
  # Per-backend caps (FR-D-5). AS-05 verifies claude cap holds.
  per_provider:
    claude: 3
    codex: 2
    opencode: 3
    gemini: 2
    agy: 2
  # Per-file cap for the 33 tasks with declared `files[]` (opportunistic).
  per_file: 1

# Strict-files enforcement is OFF by default; enabled only for phase-10 tasks
# (design.md OPEN — `git checkout --` can destroy concurrent work otherwise).
strict_files_phases:
  - 10

# Multiplier applied to `estimateHours` for the subprocess timeout (FR-D-3).
# Actual timeout = estimateHours * multiplier * 3600 seconds.
default_timeout_multiplier: 1.5

# Per-dispatch budget cap passed to `claude --max-budget-usd`.
budget:
  per_dispatch_usd: 5.00

# FR-D-4 (design.md §5): wall-clock delay between a failed dispatch and its
# retry. Uses `time.monotonic()` so it's immune to wall-clock jumps.
# Fase B: RATE_LIMIT failures get a longer backoff so the provider's rate
# window has time to reset before the retry hits it again.
retry:
  backoff_seconds: 5
  rate_limit_backoff_seconds: 60

# Fase 3 (multi-proyecto): prefijo aplicado a `Task.spec_ref` para armar la
# línea `Spec ref (READ FIRST):` del prompt. Cada proyecto puede sobreescribir
# esto (ej: `sdd/specs`, `docs/specs/`, `specs/`). Default: `specs`.
spec_root: specs

# Sprint B — pluggable state backend.
# `state.backend`: "sqlite" (default) or "file" (legado, se elimina en la
# reescritura — kept only so pre-v0.11 projects keep booting).
# `state.sqlite_path`: absolute path or relative-to-state_dir path to the DB
# file. Defaults to `<state_dir>/orch.db`. Ignored when backend == "file".
state:
  backend: sqlite
  sqlite_path: null

# Sprint 7 — provider budget guardrails.
# `budgets_config` is the path (relative to the orchestrator package OR the
# project root) to a `budgets.yaml` file. Absent/missing file → gate disabled
# (backwards-compat: everything works exactly like pre-Sprint 7).
# `budgets_preset` picks which preset inside that file to use. Overridable
# with `--budgets-preset` on the CLI or `ORCH_BUDGETS_PRESET` env var.
# `typical_dispatch_tokens` is the estimated tokens spent on ONE dispatch —
# used at startup for preset sanity: if any provider's `token_budget` is
# < 2 * typical, orch prints a WARN because dispatches will serialize inside
# the budget window (see budget.warn_undersized_presets).
budgets_config: budgets.yaml
budgets_preset: conservative
typical_dispatch_tokens: 200000

# Dogfooding — let agents report problems with orch itself.
# `enabled: true` turns on the MCP tool `orch_report_finding`: an agent files a
# bug, improvement or feature request as an `auto-reported` issue on
# hectorcanaimero/orch with your own `gh` login, and every dispatch prompt ends
# with an optional "Feedback about orch itself" block. Off by default because
# it publishes under your account. See docs/DOGFOODING.md.
report_findings:
  enabled: false

# Sprint E-2 / E-3 — dashboard client (SPA + FastAPI) knobs. All optional.
# `profile` / `token` gate the middleware (operator|stakeholder|both — see
# orchestrator/dashboard/dashboard_config.py). Sprint H-2's `kanban`/
# `tunnel` defaults live in this same block — a second top-level
# `dashboard:` key used to follow further down (bug 4, see
# docs/brainstorm/go-migration-notes.md): PyYAML silently keeps only the
# LAST block on a duplicate top-level key, so that second definition had
# been clobbering show_spend_to_stakeholder/summary_language below since
# H-2 shipped. Never split `dashboard:` across two blocks again.
dashboard:
  # profile: operator                                                     # operator | stakeholder | both
  # token: ""                                                             # required when profile != operator
  show_spend_to_stakeholder: false                                        # G-5: expose the Budget/spend view to stakeholders (off by default — spend is sensitive)
  summary_language: es                                                    # G-4: executive summary language — es | en
  kanban:
    wip_default: null          # integer or null. null = no WIP badge unless ?wip=N.
    sort_default: null         # "impact" | null (default = phase asc + id asc).
    group_default: null        # "phase" | null.
    refresh_interval_s: 10     # HTMX polling cadence for the board.
  # Tunnel manager (Sprint E-5). Disabled by default. Flip `enabled: true`
  # to expose `/api/tunnel/*` (three-gate: config → operator profile →
  # loopback host). Requires `autossh` on PATH.
  tunnel:
    enabled: false
    provider: autossh          # v1 allowlist: autossh, bore.
    command: autossh
    args:
      - "-M"
      - "0"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "ServerAliveInterval=30"
      - "-o"
      - "ExitOnForwardFailure=yes"
      - "-p"
      - "443"
      - "-R"
      - "0:localhost:7420"
      - "a.pinggy.io"
    auto_start: false          # true = self-probe + spawn on dashboard boot.
    startup_probe_timeout_s: 3    # 1..30 — self-probe timeout for auto_start.
    url_parse_timeout_s: 30       # 5..300 — how long we wait for the URL line.

# Sprint F-2 — git worktree isolation per task.
# When worktree_mode is true, each dispatched task runs in a dedicated
# git worktree (../<project>.worktrees/<task-id>/, next to the project, not
# inside it) on branch orch/<task-id>, branched off base_branch. On agent
# success the branch is pushed to origin with --force-with-lease. On failure the branch is NOT pushed. The worktree
# directory is always cleaned up after the task exits (success or failure).
dispatch:
  worktree_mode: true    # on by default — set to false to run agents in-place
  base_branch: main      # branch new worktrees are based on

# Sprint F-4 — VCS integration (PR automation + CI polling).
# Requires dispatch.worktree_mode: true to have any effect.
# Auth via CLI tool (gh for GitHub, glab for GitLab) — user must be authenticated.
# Silent degradation if CLI is not available.
vcs:
  provider: github           # github | gitlab
  host: github.com           # self-hosted: gitlab.mycompany.com
  auto_pr: true              # on by default — set to false to skip PR creation
  ci_max_retries: 1          # CI-triggered re-dispatches before blocking the task
  ci_poll_interval_s: 30     # seconds between CI status checks

# Sprint G-1 — CI workflow auto-generation + auto-merge.
# `orch init` generates .github/workflows/orch-ci.yml from this section
# when it's absent from the target repo (never overwrites an existing one).
github:
  test_command: pytest       # command the generated CI workflow runs
  auto_merge: false          # opt-in — requires branch protection on the repo

# Sprint G-6 — Slack/Discord webhooks + `orch notify digest`.
# Empty webhook URLs disable that channel. Failures are silent by design —
# a broken webhook never surfaces into the dispatch loop. Triggers today:
# task moved to `blocked`, and CI blocked after ci_max_retries.
notifications:
  slack_webhook: ""          # https://hooks.slack.com/services/...
  discord_webhook: ""        # https://discord.com/api/webhooks/...
  timeout_s: 5               # per-request timeout for the POST

# Presentation layer — labels shown in the dashboard UI.
# Override any key to use your own language. Internal status values never change.
presentation:
  status_labels:
    backlog:     "Planificado"
    todo:        "Por hacer"
    in_progress: "En progreso"
    in-progress: "En progreso"
    done:        "Entregado"
    blocked:     "Bloqueado"
    skipped:     "Omitido"
