# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  node:
    name: node (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  services-api:
    name: "services/api: python (uv)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
