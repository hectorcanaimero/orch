# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  python:
    name: python (poetry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pipx install poetry && poetry install
      - name: Typecheck
        run: poetry run mypy .
      - name: Test
        run: poetry run pytest
