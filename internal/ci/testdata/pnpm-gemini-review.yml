# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  node:
    name: node (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run type-check
      - name: Test
        run: pnpm run test

  review:
    name: AI review (gemini)
    needs: [node]
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the review CLI
        run: npm install -g @google/gemini-cli
      - name: Install orch
        env:
          GH_TOKEN: ${{ github.token }}
        run: "gh release download v0.14.0 --repo hectorcanaimero/orch --pattern \"orch_*_linux_amd64.tar.gz\" --pattern checksums.txt --dir \"$RUNNER_TEMP/orch\" && cd \"$RUNNER_TEMP/orch\" && sha256sum --check --ignore-missing checksums.txt && mkdir -p \"$HOME/.local/bin\" && tar -xzf orch_*_linux_amd64.tar.gz -C \"$HOME/.local/bin\" orch && echo \"$HOME/.local/bin\" >> \"$GITHUB_PATH\""
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: orch ci review --provider gemini --model gemini-2.5-flash --post --blocking
