[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.7.1"
description = "Task orchestrator that walks a tasks.json DAG and dispatches to claude/codex/opencode CLIs with per-provider budget guardrails"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Héctor Canaimero", email = "knaimero@gmail.com" }]
keywords = ["orchestrator", "cli", "claude", "codex", "opencode", "dag", "dispatch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
    # Dashboard MVP (dashboard/ package). Both are required to boot
    # the FastAPI app. Keeping them in the core dep set (not an extra) so
    # `orch dashboard` works without a second install step.
    # fastapi capped at <0.116: 0.141+ regressed closure-scoped Request
    # annotation resolution under `from __future__ import annotations`,
    # returning 422 on routes with `Request` params. Revisit when the
    # root cause is understood upstream.
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI TestClient uses httpx under the hood
]

[project.scripts]
orch = "orchestrator.orch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]
exclude = ["orchestrator.tests*"]

[tool.setuptools.package-data]
# Ship the runtime YAML config with the wheel. The dashboard UI is the
# React SPA (see `spa/**/*` under the `orchestrator` entry below);
# templates/ + static/ (Jinja server-rendered dashboard) are gone.
"orchestrator.dashboard" = ["pricing.yaml", "dashboard.yaml"]
"orchestrator.state" = ["sqlite_migrations/*.sql"]
# Ship the runtime YAML defaults so `pipx`-installed orch works without a
# manual copy step. `config.yaml`, `model_router.yaml` and `budgets.yaml`
# live at the package root and can be overridden per-project.
"orchestrator" = [
    "config.yaml",
    "model_router.yaml",
    "budgets.yaml",
    "templates/*.tmpl",
    "templates/scripts/*.sh",
    "templates/specs/*.md",
    "templates/openspec/*.md",
    "spa/**/*",
    "spa/.orch-spa.json",
]
