{% extends "base.html" %}
{% block title %}Kanban · {{ project_id }}{% endblock %}
{% block content %}
<div class="px-6 py-4 flex flex-col gap-4"
     x-data="{
       modal: null,
       polling: (localStorage.getItem('kanbanPolling') ?? 'true') === 'true',
       init() {
         // Fires refresh-board every 10s IF polling is on AND no modal is open.
         // Modal open → operator is reading; avoid the layout jump.
         setInterval(() => {
           if (this.polling && this.modal === null) {
             document.body.dispatchEvent(new CustomEvent('refresh-board'));
           }
         }, 10000);
         this.$watch('polling', v => localStorage.setItem('kanbanPolling', v));
       }
     }">
  <!-- Toolbar (mirrors index.html filters minus status, which is the column axis) -->
  <section class="bg-base-100 border border-base-300 rounded-lg shadow-sm">
    <form method="get" action="/kanban" class="flex flex-wrap items-center gap-2 p-3">
      <input type="text" name="q" value="{{ filters.q or '' }}" placeholder="Buscar id/título..."
             class="flex-1 min-w-[12rem] bg-base-100 border border-base-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
      <select name="model" class="bg-base-100 border border-base-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40">
        <option value="">Modelo (todos)</option>
        {% for m in models %}
        <option value="{{ m }}" {% if filters.model == m %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select>
      <select name="phase" class="bg-base-100 border border-base-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40">
        <option value="">Fase (todas)</option>
        {% for p in phases %}
        <option value="{{ p.phase }}" {% if filters.phase == p.phase %}selected{% endif %}>Phase {{ p.phase }} ({{ p.done }}/{{ p.total }})</option>
        {% endfor %}
      </select>
      <select name="group" class="bg-base-100 border border-base-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" title="Group inside columns">
        <option value="">Group: none</option>
        <option value="phase" {% if filters.group == 'phase' %}selected{% endif %}>Group: phase</option>
      </select>
      <select name="sort" class="bg-base-100 border border-base-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" title="Sort within columns">
        <option value="">Sort: phase/id</option>
        <option value="impact" {% if filters.sort == 'impact' %}selected{% endif %}>Sort: impact ↓</option>
      </select>
      <label class="text-sm flex items-center gap-1" title="Warn columns above this count">
        WIP
        <input type="number" name="wip" min="1" max="99" value="{{ filters.wip or '' }}" placeholder="—"
               class="w-14 bg-base-100 border border-base-300 rounded px-1 py-0.5 text-sm" />
      </label>
      <label class="text-sm flex items-center gap-1">
        <input type="checkbox" name="parallelizable" value="1" {% if filters.parallelizable %}checked{% endif %} />
        Paralelizables ahora
      </label>
      <label class="text-sm flex items-center gap-1" title="Only tasks with at least one comment">
        <input type="checkbox" name="has_comments" value="1" {% if filters.has_comments %}checked{% endif %} />
        With comments
      </label>
      <label class="text-sm flex items-center gap-1" title="Only tasks with a spec_ref set">
        <input type="checkbox" name="has_spec" value="1" {% if filters.has_spec %}checked{% endif %} />
        With spec
      </label>
      <label class="text-sm flex items-center gap-1" title="Blocked tasks stuck N+ days">
        Stuck≥
        <input type="number" name="blocked_since" min="0" max="365" value="{{ filters.blocked_since or '' }}" placeholder="d"
               class="w-14 bg-base-100 border border-base-300 rounded px-1 py-0.5 text-sm" />
      </label>
      <button type="submit" class="btn btn-primary btn-sm">
        Aplicar
      </button>
      <a href="/kanban" class="text-sm opacity-60 hover:opacity-100">Reset</a>
      <span class="ml-auto text-xs opacity-60 flex items-center gap-2">
        <button type="button" @click="polling = !polling"
                class="inline-flex items-center gap-1 border border-base-300 rounded px-1.5 py-0.5 hover:bg-base-200"
                :title="polling ? 'Auto-refresh ON — click to pause' : 'Auto-refresh PAUSED — click to resume'">
          <span class="w-1.5 h-1.5 rounded-full"
                :class="polling ? 'bg-success animate-pulse' : 'bg-base-content/40'"></span>
          <span x-text="polling ? 'live' : 'paused'"></span>
        </button>
        <button type="button" @click="navigator.clipboard.writeText(location.href).then(() => $el.textContent = 'copied ✓').then(() => setTimeout(() => $el.textContent = 'save view', 1500))"
                class="border border-base-300 rounded px-1.5 py-0.5 hover:bg-base-200"
                title="Copy this view's URL to clipboard">
          save view
        </button>
        <span>{{ row_count }} / {{ total_count }} tasks</span>
      </span>
    </form>
  </section>

  <!-- Board (extracted so /kanban?partial=board can return just this) -->
  {% include "partials/kanban_board.html" %}

  <!-- Modal container (same pattern as Tasks view) -->
  <template x-if="modal">
    <div class="modal-backdrop" @click.self="modal=null">
      <div class="modal" x-html="modal"></div>
    </div>
  </template>
</div>
{% endblock %}
