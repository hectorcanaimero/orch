<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Orch Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    /* Tiny helpers on top of Tailwind. Everything else comes from utility classes. */
    body { font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", sans-serif; }
    .badge { display: inline-flex; align-items: center; padding: 0.15rem 0.5rem;
             border-radius: 9999px; font-size: 0.7rem; font-weight: 600;
             letter-spacing: 0.02em; text-transform: uppercase; }
    .status-done         { background: #dcfce7; color: #166534; }
    .status-in-progress  { background: #dbeafe; color: #1e40af; }
    .status-blocked      { background: #fee2e2; color: #991b1b; }
    .status-backlog      { background: #f3f4f6; color: #374151; }
    .status-todo         { background: #f3f4f6; color: #374151; }
    .sev-ok    { color: #16a34a; }
    .sev-err   { color: #dc2626; }
    .sev-warn  { color: #ca8a04; }
    .sev-block { color: #ea580c; }
    .sev-info  { color: #2563eb; }
    .sev-muted { color: #6b7280; }
    .log-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.75rem; padding: 0.1rem 0.4rem; white-space: pre; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4);
                       z-index: 40; display: flex; align-items: center;
                       justify-content: center; padding: 2rem; }
    .modal { background: white; border-radius: 0.5rem; max-width: 46rem;
             width: 100%; max-height: 85vh; overflow: auto; padding: 1.5rem;
             box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800">
  <div class="min-h-full flex flex-col">
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/" class="text-lg font-semibold tracking-tight">Orch Dashboard</a>
        <span class="text-xs text-slate-500 hidden sm:inline">
          {{ project_id }} <span class="opacity-50">•</span> <code>{{ project_root }}</code>
        </span>
      </div>
      <nav class="flex items-center gap-2">
        <a href="/" class="px-3 py-1.5 rounded text-sm font-medium text-slate-700 hover:bg-slate-100">Tasks</a>
        <a href="/kanban" class="px-3 py-1.5 rounded text-sm font-medium text-slate-700 hover:bg-slate-100">Kanban</a>
        <a href="/metrics" class="px-3 py-1.5 rounded text-sm font-medium text-slate-700 hover:bg-slate-100">Metrics</a>
        <a href="/logs" class="px-3 py-1.5 rounded text-sm font-medium text-slate-700 hover:bg-slate-100">Logs</a>
        <a href="/snapshot" class="px-3 py-1.5 rounded text-sm font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-700"
           title="Download a JSON snapshot of the current project state">↓ snapshot</a>
      </nav>
    </header>
    <main class="flex-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-slate-200 bg-white px-6 py-2 text-xs text-slate-400 flex justify-between">
      <span>read-only view — no writes to tasks.json</span>
      <span>layout: {{ state_layout | default("legacy") }}</span>
    </footer>
  </div>
</body>
</html>
