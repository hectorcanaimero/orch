# Dashboard UX defaults. Applied when a request omits the corresponding
# query param, so URL bookmarks always win.
#
# Ship these defaults with the package; a project can override by dropping
# `<project_root>/dashboard.yaml` — same schema.

# Bind for `orch dashboard`. Handy when you run orch in multiple projects
# simultaneously — set a distinct port per project so bookmarks stay stable.
# CLI flags (--port / --host) override, then env (ORCH_DASHBOARD_PORT /
# ORCH_DASHBOARD_HOST), then this block, then the hardcoded default.
#
# To make the dashboard reachable from other machines on your network (VPN,
# LAN, remote devbox), set host to 0.0.0.0 so uvicorn binds all interfaces.
# The startup banner will print the actual LAN IP alongside the localhost URL.
# WARNING: this exposes the dashboard to anyone on the same network — only
# use it on trusted networks. Prefer the tunnel manager for remote access.
#
# Alternatives (no file edit needed):
#   orch dashboard --host 0.0.0.0
#   ORCH_DASHBOARD_HOST=0.0.0.0 orch dashboard
# server:
#   port: 7420
#   host: 0.0.0.0   # all interfaces — reachable from VPN / LAN
#   # host: 127.0.0.1  # loopback only (default)

kanban:
  wip_default: null         # integer or null. null = no WIP badge unless ?wip=N.
  sort_default: null        # "impact" | null (default = phase asc + id asc).
  group_default: null       # "phase" | null.
  refresh_interval_s: 10    # HTMX polling cadence for the board.

# Tunnel manager (Sprint E-5). See docs/DASHBOARD-PROFILES.md for the full
# guide, security caveats, and CLI examples. Default is disabled — flip
# `enabled: true` to expose `/api/tunnel/*` (three-gate: config → operator
# profile → loopback host). Requires `autossh` on PATH (macOS: `brew install
# autossh`; Debian/Ubuntu: `sudo apt install autossh`).
tunnel:
  enabled: false
  provider: autossh         # v1 allowlist: autossh, bore.
  command: autossh          # MUST equal the provider's pinned binary.
  # `args` forwarded verbatim to the subprocess. The default below fronts
  # Pinggy's free tier on port 443 → localhost:7420.
  args:
    - "-M"
    - "0"
    - "-o"
    - "StrictHostKeyChecking=no"
    - "-o"
    - "ServerAliveInterval=30"
    - "-o"
    - "ExitOnForwardFailure=yes"
    - "-p"
    - "443"
    - "-R"
    - "0:localhost:7420"
    - "a.pinggy.io"
  auto_start: false         # true = self-probe + spawn on dashboard boot.
  startup_probe_timeout_s: 3   # 1..30 — self-probe timeout for auto_start.
  url_parse_timeout_s: 30      # 5..300 — how long we wait for the URL line.

  # ------------------------------------------------------------------
  # Alternative: bore (https://github.com/ekzhang/bore)
  # No signup, no interstitial page. TCP raw (URL is http://, not https).
  # bore.pub is a free public server; assigns a random port on connect.
  # Install: `cargo install bore-cli` OR download a release binary from
  #   https://github.com/ekzhang/bore/releases
  #
  # NOTE: bore has no supervisor-style reconnect loop — if the tunnel
  # drops the process exits and the manager transitions to error. Restart
  # via /api/tunnel/start (or `orch dashboard`) when that happens.
  #
  # To switch, replace the block above with:
  #
  # tunnel:
  #   enabled: true
  #   provider: bore
  #   command: bore
  #   args:
  #     - "local"
  #     - "7420"
  #     - "--to"
  #     - "bore.pub"
  #   auto_start: false
  #   startup_probe_timeout_s: 3
  #   url_parse_timeout_s: 30
  # ------------------------------------------------------------------
