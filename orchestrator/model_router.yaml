# model_router.yaml — maps every `tasks.json` model string to a backend CLI
# invocation. Keyed by the EXACT string that appears in `tasks.json` (do NOT
# rename keys without updating all tasks.json files — the router validator
# does an exact match; see AS-06).
#
# Fields (per orchestrator/models.py::RouteEntry):
#   backend             : one of {claude, codex, opencode, gemini}
#   cli_model           : native model string the chosen CLI expects
#   tier                : one of {premium, standard, cheap} — drives semi gate
#   is_premium          : cached tier == "premium" (denormalized for hot path)
#   fallback_cli_model  : (optional) same-family fallback used when the CLI's
#                         local registry lacks `cli_model` (FR-D-7). Emit ONE
#                         WARN per substitution at startup.
#
# Routing rules:
#   claude/*               → claude CLI (Anthropic-native)
#   codex/*                → codex CLI (OpenAI-native)
#   gemini/*               → gemini CLI (Google-native)
#   opencode/*             → opencode CLI pass-through (DeepSeek, Qwen, GLM…)
#   opencode-go/*          → opencode CLI pass-through (legacy cheap routes)
#
# Premium tier assigned per spec FR-C-1a:
#   opus, gpt-5.6, gemini-3.0-pro, deepseek-v4-pro.
#
# Audit 2026-08-20: cleanup pass against the opencode-go accepted-model
# registry. Renamed stale routes (grok-4.6 → grok-4.5, minimax-m2.5 →
# minimax-m2.7), rerouted Gemini (not in accepted list) to xAI/DeepSeek,
# restored the mimo temp-patch, and added new premium/standard/cheap routes
# for the accepted models. See orchestrator/tests/test_model_router.py.

