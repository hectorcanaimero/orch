  cli_model: gpt-5.4
  tier: standard
  is_premium: false
  fallback_cli_model: gpt-5

opencode/gpt-5.5-codex:
  backend: codex
  # verified 2026-08-20: codex exec -m gpt-5.6-luna works
  cli_model: gpt-5.6-luna
  fallback_cli_model: gpt-5.4
  tier: standard
  is_premium: false

opencode/gpt-5.6-codex:
  backend: codex
  # verified 2026-08-20: codex exec -m gpt-5.6-luna works
  cli_model: gpt-5.6-luna
  tier: premium
  is_premium: true
  fallback_cli_model: gpt-5.4

# ----- Anything else via opencode CLI pass-through -----

opencode/gemini-3.0-pro:
  # Rerouted 2026-08-20: Gemini is NOT in the opencode-go accepted list. The
  # closest premium-tier substitute is xAI's Grok 4.5 (also frontier-class,
  # long-context). Fallback to deepseek-v4-pro (premium-tier, same tier).
  # Escalation 2026-08 (FR-D-8): on attempt-3 after retryable failure,
  # escalate to opencode/deepseek-v4-pro — different backend cli_model +
  # different family, breaks provider-level rate-limit sticky failures.
  backend: opencode
  cli_model: opencode-go/grok-4.5
  tier: premium
  is_premium: true
  fallback_cli_model: deepseek/deepseek-v4-pro
  escalation_model: opencode/deepseek-v4-pro

