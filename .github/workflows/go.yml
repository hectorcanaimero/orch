name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/dashboard embeds web/'s build (G5.1) and its own test
      # suite checks the real thing, not just that a placeholder compiles
      # — so this job needs a genuine `pnpm build`, not only Go tooling.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - run: make test

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint must be built with a Go at least as new as go.mod's
      # directive, or it refuses to run. modernc.org/sqlite requires 1.25.0,
      # so v1.61.0 (built with 1.23) no longer works here. v2 changed the
      # config schema — see .golangci.yml.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
