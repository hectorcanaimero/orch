name: Site

# Publishes site/ — the project's public page — to GitHub Pages. The pages are
# plain static files; the one thing built here is the playground's engine
# (site/playground/orch.wasm + wasm_exec.js, `make site-wasm`), which is
# gitignored rather than committed. The template gallery and the playground
# page are committed HTML from `make site-templates`, kept current by
# cmd/sitegen's tests in go.yml.
#
# Needs Pages enabled once with "GitHub Actions" as the source
# (Settings → Pages, or `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`).
# Until then the deploy job fails with a message saying so and nothing else is
# affected.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "cmd/orch-wasm/**"
      - "internal/sitegen/**"
      - "internal/atomize/**"
      - "internal/graph/**"
      - "internal/model/**"
      - ".github/workflows/pages.yml"
  # A PR that breaks the WebAssembly build fails here, before it reaches main.
  pull_request:
    paths:
      - "cmd/orch-wasm/**"
      - "internal/sitegen/**"
      - "internal/atomize/**"
      - "internal/graph/**"
      - "internal/model/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the playground engine
        run: make site-wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
