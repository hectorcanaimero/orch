name: Wheel build smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: bash scripts/build-wheel.sh
      - name: Verify SPA in wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          python -m zipfile -l "$WHEEL" | grep -qE "orchestrator/spa/index\.html" || exit 1
          python -m zipfile -l "$WHEEL" | grep -qE "orchestrator/spa/assets/.*\.js" || exit 1
          echo "OK: $WHEEL contains SPA"
      - name: Install into isolated venv and probe
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/orch --help | head -5
