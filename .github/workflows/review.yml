name: PR review

# Two jobs. `gemini-review` is comment-only: it never merges, never pushes,
# never edits code, and is handed no GitHub token at all. `policy` is the one
# with teeth — since G4.7 it can arm GitHub's auto-merge on a PR that no
# protected zone covers, but only while the ORCH_AUTOMERGE repo variable is
# `on`, and GitHub still holds the merge until the required checks pass.
# See docs/CI-REVIEW.md for the whole design and how to turn it off.
#
# `pull_request`, NOT `pull_request_target`: this workflow reads the PR diff,
# and `pull_request_target` would run it with a writable token in the context
# of the base repo. Fork PRs get no secrets from GitHub anyway, so the jobs
# below also skip them explicitly rather than failing halfway through.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The whole workflow is read-only by default; each job asks for exactly what
# it writes.
permissions:
  contents: read

# One review per PR. A new push cancels the review of the commit it replaced —
# that review is about to be wrong anyway.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # Is this PR the kind of change that can merge itself? The rules live in
  # .github/review/policy.json; this job evaluates them, publishes the
  # `automerge-eligible` check, and — since G4.7 — arms GitHub's auto-merge
  # for the PRs that pass.
  #
  # Arming is not merging. GitHub holds the PR until every required check on
  # `main` is green, so `gemini-review`'s verdict is what actually gates the
  # merge; this job only decides whether the PR is allowed to wait in that
  # queue at all. A PR that touches a protected zone is never armed, so it
  # sits there until a human presses the button, however green it is.
  # --------------------------------------------------------------------------
  policy:
    name: Auto-merge policy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # write, not read: the arm/disarm steps below call `gh pr merge`.
      pull-requests: write
      checks: write
    outputs:
      eligible: ${{ steps.evaluate.outputs.eligible }}
      reason: ${{ steps.evaluate.outputs.reason }}
      changed_lines: ${{ steps.evaluate.outputs.changed_lines }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The rules decide what can merge unattended, so they get their own
      # fixtures and they run before they are trusted.
      - name: Self-test the policy rules
        run: bash .github/review/policy.test.sh

      - name: Collect the PR's files and labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json files \
            --jq '[.files[] | {path: .path, additions: .additions, deletions: .deletions}]' > files.json
          gh pr view "$PR" --repo "$REPO" --json labels \
            --jq '[.labels[].name]' > labels.json
          echo "files:"; cat files.json
          echo "labels:"; cat labels.json

      - name: Evaluate
        id: evaluate
        run: |
          bash .github/review/policy.sh --files files.json --labels labels.json \
            | tee -a "$GITHUB_OUTPUT"

      # `neutral` rather than `failure` when a PR is not eligible: needing a
      # human is the normal case, not a broken build.
      - name: Publish the automerge-eligible check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ELIGIBLE: ${{ steps.evaluate.outputs.eligible }}
          REASON: ${{ steps.evaluate.outputs.reason }}
        run: |
          if [ "${ELIGIBLE:-}" = "true" ]; then
            CONCLUSION=success
            TITLE="Eligible for auto-merge"
          else
            CONCLUSION=neutral
            TITLE="Needs a human"
          fi
          jq -n --arg sha "$HEAD_SHA" --arg c "$CONCLUSION" \
                --arg t "$TITLE" --arg s "${REASON:-policy did not run}" \
            '{name: "automerge-eligible", head_sha: $sha, status: "completed",
              conclusion: $c, output: {title: $t, summary: $s}}' \
            | gh api "repos/$REPO/check-runs" -X POST --input - >/dev/null

      # ---- G4.7 -------------------------------------------------------------
      # `vars.ORCH_AUTOMERGE` is the global switch, and an unset variable
      # reads as off. It gates arming only — turning it off is handled by the
      # disarm step below, because a PR armed while it was on would otherwise
      # merge itself long after the switch was flipped.
      - name: Arm auto-merge
        if: vars.ORCH_AUTOMERGE == 'on' && steps.evaluate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # `--auto` is refused when the PR is already mergeable right now —
          # there is nothing left to wait for. That happens on `reopened`, and
          # on a re-run after the checks finished. `CLEAN` means every required
          # check passed, `gemini-review` included, so merging on the spot is
          # the same outcome by a different route, not a shortcut past it.
          STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus \
            --jq '.mergeStateStatus' 2>/dev/null || echo UNKNOWN)
          echo "mergeStateStatus=$STATE"

          if [ "$STATE" = "CLEAN" ]; then
            gh pr merge "$PR" --repo "$REPO" --squash
            echo "merged (nothing left to wait for)"
            exit 0
          fi

          if gh pr merge "$PR" --repo "$REPO" --squash --auto 2>err.txt; then
            echo "auto-merge armed; GitHub will merge when the required checks pass"
            exit 0
          fi

          cat err.txt >&2
          # Every known cause is a repository setting, and the raw GraphQL
          # error names none of them. See docs/CI-REVIEW.md.
          echo "::error title=Could not arm auto-merge::Check that 'Allow auto-merge' is on for the repository and that main has branch protection with required checks — see docs/CI-REVIEW.md"
          exit 1

      # The switch has to undo, not just stop arming. Two cases reach here
      # with something already armed: ORCH_AUTOMERGE was turned off after the
      # PR was armed, and a later push made an eligible PR ineligible (it now
      # touches a protected path, or picked up `needs-human`). Both must take
      # the PR back out of the queue.
      #
      # `!cancelled()` rather than `always()`: a push cancels the in-flight
      # review, and a cancelled run disarming a PR that its replacement is
      # about to arm is pure churn. A failed `Evaluate` still disarms —
      # unknown eligibility is not eligible.
      - name: Disarm auto-merge
        if: ${{ !cancelled() && (vars.ORCH_AUTOMERGE != 'on' || steps.evaluate.outputs.eligible != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ask before disabling: `--disable-auto` errors on a PR that has
          # nothing armed, which is the overwhelmingly common case here and
          # would turn every ineligible PR into a red job.
          ARMED=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')
          if [ "$ARMED" = "true" ]; then
            gh pr merge "$PR" --repo "$REPO" --disable-auto
            echo "auto-merge disarmed"
          else
            echo "nothing was armed"
          fi

  # --------------------------------------------------------------------------
  # The reviewer. Gets the diff and the checklist, returns JSON, and that is
  # the whole of its authority — it is handed no GitHub token, and the Gemini
  # CLI runs with every built-in tool disabled, so it cannot read the repo,
  # run a command, or touch the PR. This job publishes the comment and the
  # check on its behalf.
  # --------------------------------------------------------------------------
  gemini-review:
    name: Gemini review
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history, so the prompt step can build the diff itself when
          # GitHub refuses to serve one (see "diff too large" below).
          fetch-depth: 0

      - name: Self-test the output parser
        run: bash .github/review/parse-review.test.sh

      # A missing key must be loud. Without this the action runs, fails
      # somewhere inside the CLI, and the failure reads like a model problem.
      - name: Is the API key configured?
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No GEMINI_API_KEY::The review was skipped. Set it with: gh secret set GEMINI_API_KEY  (see docs/CI-REVIEW.md)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the review prompt
        id: prompt
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The whole prompt reaches the reviewer action as ONE environment
          # string (its `prompt` input becomes INPUT_PROMPT), and Linux caps a
          # single argv/environ string at 128 KiB (MAX_ARG_STRLEN). Run
          # 34660387091 (#163, a 142 KB diff) died with "Argument list too
          # long" — and, because the prompt travelled through GITHUB_ENV, so
          # did every later step, including the one that publishes the
          # check. So the cap is on the PROMPT, not the diff, and the diff
          # gets whatever is left after the checklist and the PR header.
          # Truncating is better than blowing the limit and getting no review
          # at all — or a confident review of the first half.
          MAX_PROMPT_BYTES=120000
          # gh 2.100 refuses to print a diff carrying terminal escapes, even
          # into a file. Real CLI captures under testdata/ keep theirs (run
          # 34710647527, #215: gemini's untrusted-directory.log is red), and
          # this diff only ever lands in a file, never on a terminal.
          #
          # Diff too large: GitHub's API answers HTTP 406 for a PR diff over
          # 20,000 lines (run 34749743670, #221 deleting orchestrator/, ~56k
          # lines), and the review died here before reading anything. Only
          # that refusal falls back — any other gh failure still fails the
          # step. The fallback is git's own diff between the same two commits,
          # with deleted files listed by name instead of line by line: a
          # deletion has nothing left to review but its reach, and the lines
          # that remain are the ones that decide whether it is safe.
          if ! gh pr diff "$PR" --repo "$REPO" --allow-escape-sequences > full.diff 2> diff.err; then
            if ! grep -q 'exceeded the maximum number of lines' diff.err; then
              cat diff.err >&2
              exit 1
            fi
            BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            {
              echo "[GitHub refuses to serve diffs over 20000 lines. This diff was built with"
              echo " git diff $BASE..$HEAD_SHA: every deleted file is listed below by name,"
              echo " and every other change follows in full.]"
              echo
              git diff --name-only --diff-filter=D "$BASE" "$HEAD_SHA" | awk '{print "deleted: " $0}'
              echo
              git diff --diff-filter=d "$BASE" "$HEAD_SHA"
            } > full.diff
            echo "::notice title=Diff built locally::GitHub refused the PR diff (over 20000 lines); reviewing git diff with deleted files listed by name"
          fi
          DIFF_BYTES=$(wc -c < full.diff)

          gh pr view "$PR" --repo "$REPO" --json files \
            --jq '.files[] | "\(.path) (+\(.additions)/-\(.deletions))"' > files.txt

          build_head() {
            echo "You are reviewing a pull request for the orch repository."
            echo "Apply the checklist below to the diff below. Nothing else."
            echo "You have NO tools: do not call, invoke or request any tool,"
            echo "and do not ask to read or search files. Judge from the diff"
            echo "alone. If a rule cannot be checked from the diff (a test you"
            echo "cannot see, a file that is not in it), say so as a minor"
            echo "finding instead of trying to look it up."
            echo
            echo "Respond with a single JSON object and NOTHING ELSE — no prose"
            echo "before it, no prose after it, no markdown fence. Schema:"
            echo
            echo '{'
            echo '  "verdict": "approve" | "request_changes" | "comment",'
            echo '  "blocking": [{"file": "path", "line": 12, "rule": "the checklist rule", "why": "one sentence"}],'
            echo '  "minor":    [{"file": "path", "line": 12, "rule": "the checklist rule", "why": "one sentence"}],'
            echo '  "summary": "two or three sentences for a human skimming the PR"'
            echo '}'
            echo
            echo 'Use "request_changes" only when `blocking` is non-empty.'
            echo 'Use "approve" when both lists are empty. "line" is optional.'
            echo 'Every finding must name the checklist rule it comes from.'
            echo
            echo "=== CHECKLIST ==="
            cat .github/review/CHECKLIST.md
            echo
            echo "=== PULL REQUEST ==="
            echo "Title: ${PR_TITLE}"
            echo "Body:"
            echo "${PR_BODY:-(no description)}"
            echo
            echo "Files changed:"
            cat files.txt
            echo
            echo "=== DIFF ==="
          }
          build_head > head.txt

          # 200 bytes of slack for the truncation notice and the delimiter.
          BUDGET=$(( MAX_PROMPT_BYTES - $(wc -c < head.txt) - 200 ))
          if [ "$DIFF_BYTES" -gt "$BUDGET" ]; then
            head -c "$BUDGET" full.diff > pr.diff
            printf '\n\n[diff truncated at %s bytes of %s]\n' "$BUDGET" "$DIFF_BYTES" >> pr.diff
          else
            cp full.diff pr.diff
          fi

          cat head.txt pr.diff > prompt.txt
          echo "prompt is $(wc -c < prompt.txt) bytes (diff $DIFF_BYTES, budget $BUDGET)"

          # Hand it to the action as a step OUTPUT, not through GITHUB_ENV:
          # an output only reaches the steps that reference it, so a prompt
          # near the limit cannot take the publish step down with it. The
          # delimiter is random because the diff is untrusted input and a
          # fixed one could be closed early by a line inside the patch.
          DELIM="EOF_$(openssl rand -hex 12)"
          {
            echo "prompt<<$DELIM"
            cat prompt.txt
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Pinned to a commit SHA: this step is the one that receives the API key.
      - name: Run the reviewer
        id: gemini
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # The CLI refuses to run in an untrusted directory and there is no
          # way to pass `--skip-trust` through the action. Safe here because
          # every built-in tool is disabled below: there is nothing in the
          # workspace it can reach. Deliberately NOT setting GITHUB_TOKEN —
          # the reviewer gets no credentials for this repo.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Empty means "whatever the Gemini CLI defaults to", which is what
          # the action's own docs do — pinning a model name here is a guess
          # that goes stale. Override with the GEMINI_REVIEW_MODEL repo
          # variable to pin one. See docs/CI-REVIEW.md.
          gemini_model: ${{ vars.GEMINI_REVIEW_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |-
            {
              "model": { "maxSessionTurns": 3 },
              "tools": { "core": [] }
            }

      # Exit 2 means the reviewer ran and said nothing — observed on run
      # 34638647467, where the model returned `"response": ""` and the action
      # fell back to emitting its own JSON envelope. That is
      # non-deterministic (the same commit passed on the next attempt), so it
      # earns exactly one retry. Exit 1 means the answer was off-schema, which
      # a retry would reproduce, so it does not.
      # Keep what the reviewer actually returned. An unreadable verdict is
      # only diagnosable from the raw text, and a rerun replaces the log that
      # held it (#206: the failed run's log was gone by the time anyone
      # looked). Uploaded before parsing so a parser crash cannot lose it.
      - name: Keep the raw reviewer output
        if: steps.key.outputs.present == 'true'
        env:
          RAW: ${{ steps.gemini.outputs.summary }}
        run: printf '%s' "${RAW:-}" > reviewer-raw.txt
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: reviewer-raw-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: reviewer-raw.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Parse the verdict
        id: parse
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          RAW: ${{ steps.gemini.outputs.summary }}
          ERR: ${{ steps.gemini.outputs.error }}
          ELIGIBLE: ${{ needs.policy.outputs.eligible }}
          REASON: ${{ needs.policy.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "${RAW:-}" > raw.txt
          if [ -n "${ERR:-}" ]; then
            echo "reviewer stderr: $ERR"
          fi
          set +e
          python3 .github/review/parse-review.py \
            --raw raw.txt \
            --out review.json \
            --comment comment.md \
            --eligible "${ELIGIBLE:-false}" \
            --eligible-reason "${REASON:-policy did not run}" \
            --run-url "$RUN_URL"
          rc=$?
          set -e
          echo "retryable=$([ "$rc" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Run the reviewer again
        id: gemini_retry
        if: steps.parse.outputs.retryable == 'true'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_REVIEW_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |-
            {
              "model": { "maxSessionTurns": 3 },
              "tools": { "core": [] }
            }

      - name: Parse the retry
        id: parse_retry
        if: steps.parse.outputs.retryable == 'true' && steps.gemini_retry.outcome == 'success'
        continue-on-error: true
        env:
          RAW: ${{ steps.gemini_retry.outputs.summary }}
          ELIGIBLE: ${{ needs.policy.outputs.eligible }}
          REASON: ${{ needs.policy.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "${RAW:-}" > raw.txt
          python3 .github/review/parse-review.py \
            --raw raw.txt \
            --out review.json \
            --comment comment.md \
            --eligible "${ELIGIBLE:-false}" \
            --eligible-reason "${REASON:-policy did not run}" \
            --run-url "$RUN_URL"

      # One comment per PR, edited in place. A review that reappears at the
      # bottom of the thread on every push buries the human conversation.
      - name: Post or update the review comment
        if: steps.parse.outcome == 'success' || steps.parse_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- orch:gemini-review -->'
          # --paginate applies --jq per page, so a match on page 2 with matches
          # on page 1 would print two ids. Only ever one comment carries the
          # marker, but take the first line rather than trust that.
          EXISTING=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | .[0].id // empty" \
            | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -F body=@comment.md >/dev/null
            echo "updated comment $EXISTING"
          else
            gh api "repos/$REPO/issues/$PR/comments" -X POST -F body=@comment.md >/dev/null
            echo "posted a new comment"
          fi

      # Always runs, and is the only place a conclusion is decided:
      #   request_changes                          -> failure
      #   approve / comment                        -> success
      #   reviewer crashed, empty twice, unreadable -> failure (#207: a neutral
      #                                               check reads as "clean")
      #   no API key                               -> neutral, never success
      - name: Publish the gemini-review check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          RETRY_PARSE_OUTCOME: ${{ steps.parse_retry.outcome }}
          RETRYABLE: ${{ steps.parse.outputs.retryable }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
        run: |
          set -euo pipefail
          if [ "$KEY_PRESENT" != "true" ]; then
            CONCLUSION=neutral
            TITLE="Skipped — no API key"
            SUMMARY="GEMINI_API_KEY is not set on this repository. Set it with \`gh secret set GEMINI_API_KEY\` — see docs/CI-REVIEW.md. The review did not run; this is not a pass."
          elif [ "$GEMINI_OUTCOME" != "success" ]; then
            # failure, not neutral: a neutral check leaves the PR "clean and
            # mergeable" in the checks summary, and #206 nearly merged on a
            # verdict nobody had read. Only "no API key" stays neutral — that
            # one is a repository setting, not a review outcome.
            CONCLUSION=failure
            TITLE="Reviewer failed"
            SUMMARY="The Gemini CLI step did not complete. ${GEMINI_ERROR:-See the run log.} The review did not run; this is not a pass."
          elif [ "$PARSE_OUTCOME" != "success" ] && [ "$RETRY_PARSE_OUTCOME" != "success" ]; then
            CONCLUSION=failure
            if [ "${RETRYABLE:-false}" = "true" ]; then
              TITLE="Reviewer returned nothing"
              SUMMARY="The reviewer ran twice and produced an empty response both times — it did not answer, rather than answering badly. See the run log. This is not a pass."
            else
              TITLE="Unreadable verdict"
              SUMMARY="The reviewer answered, but not with the required JSON schema. See the run log for what it returned. This is not a pass."
            fi
          else
            VERDICT=$(jq -r .verdict review.json)
            SUMMARY=$(jq -r .summary review.json)
            BLOCKING=$(jq -r '.blocking | length' review.json)
            if [ "$VERDICT" = "request_changes" ]; then
              CONCLUSION=failure
              TITLE="$BLOCKING blocking issue(s)"
            else
              CONCLUSION=success
              TITLE="No blocking issues"
            fi
          fi
          echo "conclusion=$CONCLUSION title=$TITLE"
          jq -n --arg sha "$HEAD_SHA" --arg c "$CONCLUSION" \
                --arg t "$TITLE" --arg s "$SUMMARY" \
            '{name: "gemini-review", head_sha: $sha, status: "completed",
              conclusion: $c, output: {title: $t, summary: $s}}' \
            | gh api "repos/$REPO/check-runs" -X POST --input - >/dev/null
